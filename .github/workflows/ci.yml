name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: ["1.23.x", "1.26.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  official-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Download the pinned ELK.js 0.12.0 oracle
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/kieler/elkjs/ff5771d7165445c42c408bb8a090c8035272218c/lib/elk.bundled.js \
            --output "$RUNNER_TEMP/elk.bundled.js"
          echo "1222e44f953ce7746af23801e723708f8e6f436b8b377a6a5fc7552f34a307b3  $RUNNER_TEMP/elk.bundled.js" | sha256sum --check
      - name: Run D2-scope official-oracle differentials
        env:
          ELKJS_ORACLE_ASSET: ${{ runner.temp }}/elk.bundled.js
          ELK_GO_ORACLE_ALGORITHMS: "1"
          ELK_GO_ORACLE_BASIC: "1"
          ELK_GO_ORACLE_CODEC: "1"
          ELK_GO_ORACLE_OPTIONS: "1"
          ELK_GO_ORACLE_PARITY: "1"
          ELK_GO_ORACLE_RANDOM: "100"
          ELK_GO_ORACLE_SURFACE: "1"
          ELK_GO_ORACLE_UPGRADE: "1"
        run: go test ./...
